[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finreason-agent"
version = "0.1.0"
description = "Financial Intelligence & Forensic Audit Agent with Deterministic Verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "instructor>=1.3.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "chromadb>=0.5.0",
    "openai>=1.35.0",
    "pyyaml>=6.0.1",
    "pypdf>=4.2.0",
    "tabulate>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35.0",
]

[project.scripts]
finreason = "finreason.cli:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finreason*"]
exclude = ["configs*", "data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

